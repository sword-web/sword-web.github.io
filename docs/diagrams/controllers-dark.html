<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Controllers (dark)</title>
		<link
			href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600&display=swap"
			rel="stylesheet"
		/>
		<style>
			*,
			*::before,
			*::after {
				box-sizing: border-box;
				margin: 0;
				padding: 0;
			}

			:root {
				--color-paper: #1a1a1a;
				--color-ink: #e8e8e8;
				--font-sans: "Inter", "Inter Variable", system-ui, sans-serif;
			}

			body {
				font-family: var(--font-sans);
				background: var(--color-paper);
				color: var(--color-ink);
				min-height: 100vh;
				display: flex;
				align-items: center;
				justify-content: center;
				padding: 2rem;
			}

			svg {
				width: 100%;
				max-width: 960px;
				height: auto;
				display: block;
			}
		</style>
	</head>
	<body>
		<svg
			width="800"
			height="284"
			viewBox="0 0 800 284"
			xmlns="http://www.w3.org/2000/svg"
			role="img"
			aria-labelledby="controllers-dark-title controllers-dark-desc"
		>
			<title id="controllers-dark-title">Controllers</title>
			<desc id="controllers-dark-desc">
				Web, SocketIO, Events, gRPC and Jobs controllers are registered in a Module inside the
				Sword Application.
			</desc>
			<defs>
				<marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
					<polygon points="0 0, 8 3, 0 6" fill="#b8b8b8" />
				</marker>
				<marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
					<polygon points="0 0, 8 3, 0 6" fill="#6e9ef7" />
				</marker>
				<marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
					<polygon points="0 0, 8 3, 0 6" fill="#6e9ef7" />
				</marker>
			</defs>

			<rect width="100%" height="100%" fill="#1a1a1a" />

			<!-- Sword Application: outer group fills the canvas -->
			<rect
				x="0.5"
				y="0.5"
				width="799"
				height="283"
				rx="8"
				fill="none"
				stroke="rgba(232,232,232,0.10)"
				stroke-width="0.8"
			/>
<!-- Controllers, left to right -->
			<rect x="18" y="36" width="140" height="64" rx="6" fill="#1a1a1a" />
			<rect x="18" y="36" width="140" height="64" rx="6" fill="#262626" stroke="#e8e8e8" stroke-width="0.8" />
			<text x="88" y="64" fill="#e8e8e8" font-size="12" font-weight="600" font-family="'Inter', 'Inter Variable', sans-serif" text-anchor="middle">Web</text>
			<text x="88" y="80" fill="#b8b8b8" font-size="9" font-family="'JetBrains Mono', 'JetBrains Mono Variable', monospace" text-anchor="middle">&lt;&lt;controller&gt;&gt;</text>

			<rect x="174" y="36" width="140" height="64" rx="6" fill="#1a1a1a" />
			<rect x="174" y="36" width="140" height="64" rx="6" fill="#262626" stroke="#e8e8e8" stroke-width="0.8" />
			<text x="244" y="64" fill="#e8e8e8" font-size="12" font-weight="600" font-family="'Inter', 'Inter Variable', sans-serif" text-anchor="middle">SocketIO</text>
			<text x="244" y="80" fill="#b8b8b8" font-size="9" font-family="'JetBrains Mono', 'JetBrains Mono Variable', monospace" text-anchor="middle">&lt;&lt;controller&gt;&gt;</text>

			<rect x="330" y="36" width="140" height="64" rx="6" fill="#1a1a1a" />
			<rect x="330" y="36" width="140" height="64" rx="6" fill="#262626" stroke="#e8e8e8" stroke-width="0.8" />
			<text x="400" y="64" fill="#e8e8e8" font-size="12" font-weight="600" font-family="'Inter', 'Inter Variable', sans-serif" text-anchor="middle">Events</text>
			<text x="400" y="80" fill="#b8b8b8" font-size="9" font-family="'JetBrains Mono', 'JetBrains Mono Variable', monospace" text-anchor="middle">&lt;&lt;controller&gt;&gt;</text>

			<rect x="486" y="36" width="140" height="64" rx="6" fill="#1a1a1a" />
			<rect x="486" y="36" width="140" height="64" rx="6" fill="#262626" stroke="#e8e8e8" stroke-width="0.8" />
			<text x="556" y="64" fill="#e8e8e8" font-size="12" font-weight="600" font-family="'Inter', 'Inter Variable', sans-serif" text-anchor="middle">gRPC</text>
			<text x="556" y="80" fill="#b8b8b8" font-size="9" font-family="'JetBrains Mono', 'JetBrains Mono Variable', monospace" text-anchor="middle">&lt;&lt;controller&gt;&gt;</text>

			<rect x="642" y="36" width="140" height="64" rx="6" fill="#1a1a1a" />
			<rect x="642" y="36" width="140" height="64" rx="6" fill="#262626" stroke="#e8e8e8" stroke-width="0.8" />
			<text x="712" y="64" fill="#e8e8e8" font-size="12" font-weight="600" font-family="'Inter', 'Inter Variable', sans-serif" text-anchor="middle">Jobs</text>
			<text x="712" y="80" fill="#b8b8b8" font-size="9" font-family="'JetBrains Mono', 'JetBrains Mono Variable', monospace" text-anchor="middle">&lt;&lt;controller&gt;&gt;</text>
			<!-- Side branches merge into one rounded arrow per side -->
			<path d="M 244,100 V 216 H 312" fill="none" stroke="#b8b8b8" stroke-width="1" />
			<path d="M 88,100 V 208 Q 88,216 96,216 H 312" fill="none" stroke="#b8b8b8" stroke-width="1" marker-end="url(#arrow)" />
			<path d="M 556,100 V 216 H 488" fill="none" stroke="#b8b8b8" stroke-width="1" />
			<path d="M 712,100 V 208 Q 712,216 704,216 H 488" fill="none" stroke="#b8b8b8" stroke-width="1" marker-end="url(#arrow)" />
<!-- Events enters through the top -->
			<line x1="400" y1="100" x2="400" y2="184" stroke="#b8b8b8" stroke-width="1" marker-end="url(#arrow)" />
<!-- Connection labels, all aligned on the same y -->
			<rect x="42" y="134" width="92" height="16" rx="2" fill="#222222" />
			<text x="88" y="145" fill="#b8b8b8" font-size="9" font-family="'JetBrains Mono', 'JetBrains Mono Variable', monospace" text-anchor="middle" letter-spacing="0.08em">REGISTERED IN</text>
			<rect x="198" y="134" width="92" height="16" rx="2" fill="#222222" />
			<text x="244" y="145" fill="#b8b8b8" font-size="9" font-family="'JetBrains Mono', 'JetBrains Mono Variable', monospace" text-anchor="middle" letter-spacing="0.08em">REGISTERED IN</text>
			<rect x="354" y="134" width="92" height="16" rx="2" fill="#222222" />
			<text x="400" y="145" fill="#b8b8b8" font-size="9" font-family="'JetBrains Mono', 'JetBrains Mono Variable', monospace" text-anchor="middle" letter-spacing="0.08em">REGISTERED IN</text>
			<rect x="510" y="134" width="92" height="16" rx="2" fill="#222222" />
			<text x="556" y="145" fill="#b8b8b8" font-size="9" font-family="'JetBrains Mono', 'JetBrains Mono Variable', monospace" text-anchor="middle" letter-spacing="0.08em">REGISTERED IN</text>
			<rect x="666" y="134" width="92" height="16" rx="2" fill="#222222" />
			<text x="712" y="145" fill="#b8b8b8" font-size="9" font-family="'JetBrains Mono', 'JetBrains Mono Variable', monospace" text-anchor="middle" letter-spacing="0.08em">REGISTERED IN</text>

			<!-- Module (focal) -->
			<rect x="312" y="184" width="176" height="64" rx="6" fill="#1a1a1a" />
			<rect x="312" y="184" width="176" height="64" rx="6" fill="rgba(91,142,247,0.16)" stroke="#6e9ef7" stroke-width="1" />
			<text x="400" y="212" fill="#e8e8e8" font-size="12" font-weight="600" font-family="'Inter', 'Inter Variable', sans-serif" text-anchor="middle">Module</text>
			<text x="400" y="228" fill="#6e9ef7" font-size="9" font-family="'JetBrains Mono', 'JetBrains Mono Variable', monospace" text-anchor="middle">&lt;&lt;module&gt;&gt;</text>
		</svg>
	</body>
</html>
