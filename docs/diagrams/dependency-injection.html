<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Dependency Container</title>
		<link
			href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600&display=swap"
			rel="stylesheet"
		/>
		<style>
			*,
			*::before,
			*::after {
				box-sizing: border-box;
				margin: 0;
				padding: 0;
			}

			:root {
				--color-paper: #fafafa;
				--color-ink: #2c3e50;
				--font-sans: "Inter", "Inter Variable", system-ui, sans-serif;
			}

			body {
				font-family: var(--font-sans);
				background: var(--color-paper);
				color: var(--color-ink);
				min-height: 100vh;
				display: flex;
				align-items: center;
				justify-content: center;
				padding: 2rem;
			}

			svg {
				width: 100%;
				max-width: 960px;
				height: auto;
				display: block;
			}
		</style>
	</head>
	<body>
		<svg
			width="720"
			height="176"
			viewBox="0 0 720 176"
			xmlns="http://www.w3.org/2000/svg"
			role="img"
			aria-labelledby="dependency-injection-title dependency-injection-desc"
		>
			<title id="dependency-injection-title">Dependency Container</title>
			<desc id="dependency-injection-desc">
				UserService injects UserRepository, which injects Database. All three live inside the
				Dependency Container.
			</desc>
			<defs>
				<marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
					<polygon points="0 0, 8 3, 0 6" fill="#555555" />
				</marker>
				<marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
					<polygon points="0 0, 8 3, 0 6" fill="#4a7dd9" />
				</marker>
				<marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
					<polygon points="0 0, 8 3, 0 6" fill="#5b8ef7" />
				</marker>
			</defs>

			<rect width="100%" height="100%" fill="#fafafa" />

			<!-- Dependency Container: the group is the full canvas -->
			<rect
				x="0.5"
				y="0.5"
				width="719"
				height="175"
				rx="8"
				fill="rgba(44,62,80,0.02)"
				stroke="rgba(44,62,80,0.10)"
				stroke-width="0.8"
			/>
<!-- Arrows follow the injection direction -->
			<line
				x1="192"
				y1="88"
				x2="280"
				y2="88"
				stroke="#555555"
				stroke-width="1"
				marker-end="url(#arrow)"
			/>
			<line
				x1="440"
				y1="88"
				x2="528"
				y2="88"
				stroke="#555555"
				stroke-width="1"
				marker-end="url(#arrow)"
			/>

			<!-- Arrow labels -->
			<rect x="204" y="68" width="64" height="12" rx="2" fill="#fafafa" />
			<text
				x="236"
				y="77"
				fill="#555555"
				font-size="8"
				font-family="'JetBrains Mono', 'JetBrains Mono Variable', monospace"
				text-anchor="middle"
				letter-spacing="0.08em"
			>
				DEPENDS ON
			</text>
			<rect x="452" y="68" width="64" height="12" rx="2" fill="#fafafa" />
			<text
				x="484"
				y="77"
				fill="#555555"
				font-size="8"
				font-family="'JetBrains Mono', 'JetBrains Mono Variable', monospace"
				text-anchor="middle"
				letter-spacing="0.08em"
			>
				DEPENDS ON
			</text>

			<!-- Node: UserService (focal) -->
			<rect x="32" y="56" width="160" height="64" rx="6" fill="#fafafa" />
			<rect
				x="32"
				y="56"
				width="160"
				height="64"
				rx="6"
				fill="rgba(74,125,217,0.12)"
				stroke="#4a7dd9"
				stroke-width="1"
			/>
			<text
				x="112"
				y="84"
				fill="#2c3e50"
				font-size="12"
				font-weight="600"
				font-family="'Inter', 'Inter Variable', sans-serif"
				text-anchor="middle"
			>
				UserService
			</text>
			<text
				x="112"
				y="100"
				fill="#4a7dd9"
				font-size="9"
				font-family="'JetBrains Mono', 'JetBrains Mono Variable', monospace"
				text-anchor="middle"
			>
				&lt;&lt;component&gt;&gt;
			</text>

			<!-- Node: UserRepository -->
			<rect x="280" y="56" width="160" height="64" rx="6" fill="#fafafa" />
			<rect
				x="280"
				y="56"
				width="160"
				height="64"
				rx="6"
				fill="#ffffff"
				stroke="#2c3e50"
				stroke-width="0.8"
			/>
			<text
				x="360"
				y="84"
				fill="#2c3e50"
				font-size="12"
				font-weight="600"
				font-family="'Inter', 'Inter Variable', sans-serif"
				text-anchor="middle"
			>
				UserRepository
			</text>
			<text
				x="360"
				y="100"
				fill="#555555"
				font-size="9"
				font-family="'JetBrains Mono', 'JetBrains Mono Variable', monospace"
				text-anchor="middle"
			>
				&lt;&lt;component&gt;&gt;
			</text>

			<!-- Node: Database (provider) -->
			<rect x="528" y="56" width="160" height="64" rx="6" fill="#fafafa" />
			<rect
				x="528"
				y="56"
				width="160"
				height="64"
				rx="6"
				fill="rgba(44,62,80,0.05)"
				stroke="#555555"
				stroke-width="0.8"
			/>
			<text
				x="608"
				y="84"
				fill="#2c3e50"
				font-size="12"
				font-weight="600"
				font-family="'Inter', 'Inter Variable', sans-serif"
				text-anchor="middle"
			>
				Database
			</text>
			<text
				x="608"
				y="100"
				fill="#555555"
				font-size="9"
				font-family="'JetBrains Mono', 'JetBrains Mono Variable', monospace"
				text-anchor="middle"
			>
				&lt;&lt;provider&gt;&gt;
			</text>

		</svg>
	</body>
</html>
