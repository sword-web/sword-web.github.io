<?xml version="1.0" encoding="UTF-8"?>
<svg
			width="720"
			height="176"
			viewBox="0 0 720 176"
			xmlns="http://www.w3.org/2000/svg"
			role="img"
			aria-labelledby="dependency-injection-dark-title dependency-injection-dark-desc"
		>
			<title id="dependency-injection-dark-title">Dependency Container</title>
			<desc id="dependency-injection-dark-desc">
				UserService injects UserRepository, which injects Database. All three live inside the
				Dependency Container.
			</desc>
			<defs>
				<marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
					<polygon points="0 0, 8 3, 0 6" fill="#b8b8b8" />
				</marker>
				<marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
					<polygon points="0 0, 8 3, 0 6" fill="#6e9ef7" />
				</marker>
				<marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
					<polygon points="0 0, 8 3, 0 6" fill="#6e9ef7" />
				</marker>
			</defs>

			<rect width="100%" height="100%" fill="#1a1a1a" />

			<!-- Dependency Container: the group is the full canvas -->
			<rect
				x="0.5"
				y="0.5"
				width="719"
				height="175"
				rx="8"
				fill="rgba(232,232,232,0.02)"
				stroke="rgba(232,232,232,0.10)"
				stroke-width="0.8"
			/>
<!-- Arrows follow the injection direction -->
			<line
				x1="192"
				y1="88"
				x2="280"
				y2="88"
				stroke="#b8b8b8"
				stroke-width="1"
				marker-end="url(#arrow)"
			/>
			<line
				x1="440"
				y1="88"
				x2="528"
				y2="88"
				stroke="#b8b8b8"
				stroke-width="1"
				marker-end="url(#arrow)"
			/>

			<!-- Arrow labels -->
			<rect x="204" y="68" width="64" height="12" rx="2" fill="#1a1a1a" />
			<text
				x="236"
				y="77"
				fill="#b8b8b8"
				font-size="8"
				font-family="'JetBrains Mono', 'JetBrains Mono Variable', monospace"
				text-anchor="middle"
				letter-spacing="0.08em"
			>
				DEPENDS ON
			</text>
			<rect x="452" y="68" width="64" height="12" rx="2" fill="#1a1a1a" />
			<text
				x="484"
				y="77"
				fill="#b8b8b8"
				font-size="8"
				font-family="'JetBrains Mono', 'JetBrains Mono Variable', monospace"
				text-anchor="middle"
				letter-spacing="0.08em"
			>
				DEPENDS ON
			</text>

			<!-- Node: UserService (focal) -->
			<rect x="32" y="56" width="160" height="64" rx="6" fill="#1a1a1a" />
			<rect
				x="32"
				y="56"
				width="160"
				height="64"
				rx="6"
				fill="rgba(91,142,247,0.16)"
				stroke="#6e9ef7"
				stroke-width="1"
			/>
			<text
				x="112"
				y="84"
				fill="#e8e8e8"
				font-size="12"
				font-weight="600"
				font-family="'Inter', 'Inter Variable', sans-serif"
				text-anchor="middle"
			>
				UserService
			</text>
			<text
				x="112"
				y="100"
				fill="#6e9ef7"
				font-size="9"
				font-family="'JetBrains Mono', 'JetBrains Mono Variable', monospace"
				text-anchor="middle"
			>
				&lt;&lt;component&gt;&gt;
			</text>

			<!-- Node: UserRepository -->
			<rect x="280" y="56" width="160" height="64" rx="6" fill="#1a1a1a" />
			<rect
				x="280"
				y="56"
				width="160"
				height="64"
				rx="6"
				fill="#262626"
				stroke="#e8e8e8"
				stroke-width="0.8"
			/>
			<text
				x="360"
				y="84"
				fill="#e8e8e8"
				font-size="12"
				font-weight="600"
				font-family="'Inter', 'Inter Variable', sans-serif"
				text-anchor="middle"
			>
				UserRepository
			</text>
			<text
				x="360"
				y="100"
				fill="#b8b8b8"
				font-size="9"
				font-family="'JetBrains Mono', 'JetBrains Mono Variable', monospace"
				text-anchor="middle"
			>
				&lt;&lt;component&gt;&gt;
			</text>

			<!-- Node: Database (provider) -->
			<rect x="528" y="56" width="160" height="64" rx="6" fill="#1a1a1a" />
			<rect
				x="528"
				y="56"
				width="160"
				height="64"
				rx="6"
				fill="rgba(232,232,232,0.05)"
				stroke="#b8b8b8"
				stroke-width="0.8"
			/>
			<text
				x="608"
				y="84"
				fill="#e8e8e8"
				font-size="12"
				font-weight="600"
				font-family="'Inter', 'Inter Variable', sans-serif"
				text-anchor="middle"
			>
				Database
			</text>
			<text
				x="608"
				y="100"
				fill="#b8b8b8"
				font-size="9"
				font-family="'JetBrains Mono', 'JetBrains Mono Variable', monospace"
				text-anchor="middle"
			>
				&lt;&lt;provider&gt;&gt;
			</text>

		</svg>
