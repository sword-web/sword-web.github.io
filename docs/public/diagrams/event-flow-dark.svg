<?xml version="1.0" encoding="UTF-8"?>
<svg
	width="800"
	height="208"
	viewBox="0 0 800 208"
	xmlns="http://www.w3.org/2000/svg"
	role="img"
	aria-labelledby="event-flow-dark-title event-flow-dark-desc"
>
	<title id="event-flow-dark-title">Event flow</title>
	<desc id="event-flow-dark-desc">
		An event is published to a transport, which looks up the handlers registered for its key
		and delivers the event to all of them.
	</desc>
	<defs>
		<marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
			<polygon points="0 0, 8 3, 0 6" fill="#b8b8b8" />
		</marker>
	</defs>

	<rect width="100%" height="100%" fill="#1a1a1a" />

	<!-- Connectors -->
	<line
		x1="208"
		y1="104"
		x2="320"
		y2="104"
		stroke="#b8b8b8"
		stroke-width="1"
		marker-end="url(#arrow)"
	/>
	<line
		x1="488"
		y1="104"
		x2="592"
		y2="104"
		stroke="#b8b8b8"
		stroke-width="1"
		marker-end="url(#arrow)"
	/>

	<!-- Connector labels -->
	<rect x="240" y="84" width="48" height="12" rx="2" fill="#1a1a1a" />
	<text
		x="264"
		y="93"
		fill="#b8b8b8"
		font-size="8"
		font-family="'JetBrains Mono', 'JetBrains Mono Variable', monospace"
		text-anchor="middle"
		letter-spacing="0.06em"
	>
		publish()
	</text>
	<rect x="508" y="84" width="64" height="12" rx="2" fill="#1a1a1a" />
	<text
		x="540"
		y="93"
		fill="#b8b8b8"
		font-size="8"
		font-family="'JetBrains Mono', 'JetBrains Mono Variable', monospace"
		text-anchor="middle"
		letter-spacing="0.06em"
	>
		KEY LOOKUP
	</text>

	<!-- Event -->
	<rect x="40" y="68" width="168" height="72" rx="6" fill="#1a1a1a" />
	<rect
		x="40"
		y="68"
		width="168"
		height="72"
		rx="6"
		fill="#262626"
		stroke="#e8e8e8"
		stroke-width="0.8"
	/>
	<rect
		x="48"
		y="76"
		width="36"
		height="12"
		rx="2"
		fill="transparent"
		stroke="rgba(232,232,232,0.40)"
		stroke-width="0.8"
	/>
	<text
		x="66"
		y="85"
		fill="#b8b8b8"
		font-size="7"
		font-family="'JetBrains Mono', 'JetBrains Mono Variable', monospace"
		text-anchor="middle"
		letter-spacing="0.08em"
	>
		EVENT
	</text>
	<text
		x="124"
		y="108"
		fill="#e8e8e8"
		font-size="12"
		font-weight="600"
		font-family="'Inter', 'Inter Variable', sans-serif"
		text-anchor="middle"
	>
		OrderCreated
	</text>
	<text
		x="124"
		y="124"
		fill="#b8b8b8"
		font-size="9"
		font-family="'JetBrains Mono', 'JetBrains Mono Variable', monospace"
		text-anchor="middle"
	>
		key: order.created
	</text>

	<!-- Transport (focal) -->
	<rect x="320" y="68" width="168" height="72" rx="6" fill="#1a1a1a" />
	<rect
		x="320"
		y="68"
		width="168"
		height="72"
		rx="6"
		fill="rgba(91,142,247,0.16)"
		stroke="#6e9ef7"
		stroke-width="1"
	/>
	<rect
		x="328"
		y="76"
		width="44"
		height="12"
		rx="2"
		fill="transparent"
		stroke="rgba(110,158,247,0.40)"
		stroke-width="0.8"
	/>
	<text
		x="350"
		y="85"
		fill="#6e9ef7"
		font-size="7"
		font-family="'JetBrains Mono', 'JetBrains Mono Variable', monospace"
		text-anchor="middle"
		letter-spacing="0.08em"
	>
		ROUTING
	</text>
	<text
		x="404"
		y="108"
		fill="#e8e8e8"
		font-size="12"
		font-weight="600"
		font-family="'Inter', 'Inter Variable', sans-serif"
		text-anchor="middle"
	>
		Transport
	</text>
	<text
		x="404"
		y="124"
		fill="#6e9ef7"
		font-size="9"
		font-family="'JetBrains Mono', 'JetBrains Mono Variable', monospace"
		text-anchor="middle"
	>
		memory · NATS
	</text>

	<!-- Handlers: stacked cards -->
	<rect
		x="600"
		y="76"
		width="168"
		height="72"
		rx="6"
		fill="#222222"
		stroke="rgba(232,232,232,0.12)"
		stroke-width="0.8"
	/>
	<rect x="592" y="68" width="168" height="72" rx="6" fill="#1a1a1a" />
	<rect
		x="592"
		y="68"
		width="168"
		height="72"
		rx="6"
		fill="#262626"
		stroke="#e8e8e8"
		stroke-width="0.8"
	/>
	<rect
		x="600"
		y="76"
		width="60"
		height="12"
		rx="2"
		fill="transparent"
		stroke="rgba(232,232,232,0.40)"
		stroke-width="0.8"
	/>
	<text
		x="630"
		y="85"
		fill="#b8b8b8"
		font-size="7"
		font-family="'JetBrains Mono', 'JetBrains Mono Variable', monospace"
		text-anchor="middle"
		letter-spacing="0.08em"
	>
		SUBSCRIBERS
	</text>
	<text
		x="676"
		y="108"
		fill="#e8e8e8"
		font-size="12"
		font-weight="600"
		font-family="'Inter', 'Inter Variable', sans-serif"
		text-anchor="middle"
	>
		Handlers
	</text>
	<text
		x="676"
		y="124"
		fill="#b8b8b8"
		font-size="9"
		font-family="'JetBrains Mono', 'JetBrains Mono Variable', monospace"
		text-anchor="middle"
	>
		#[subscribe(key)]
	</text>
</svg>
